name: Plugin Builder Compatibility
# NOTE: Actions are pinned to commit SHAs for supply-chain security.
# To update, resolve the new tag to a SHA:
#   gh api repos/OWNER/REPO/git/ref/tags/TAG --jq '.object.sha'
# If the result type is "tag" (annotated), dereference with:
#   gh api repos/OWNER/REPO/git/tags/SHA --jq '.object.sha'

on:
  pull_request:
  push:
    branches:
      - master
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Show environment
        run: dotnet --info

      - name: Ensure static web asset manifests exist
        run: |
          dir="submodules/btcpayserver/BTCPayServer/obj/Release/net10.0"
          mkdir -p "$dir"
          for f in staticwebassets.development.json staticwebassets.build.endpoints.json; do
            [ -f "$dir/$f" ] || echo '{}' > "$dir/$f"
          done

      - name: Build tests in Release
        run: dotnet build BTCPayServer.Plugins.Tests/BTCPayServer.Plugins.Tests.csproj -c Release -m:1

      - name: Run tests
        run: dotnet test BTCPayServer.Plugins.Tests/BTCPayServer.Plugins.Tests.csproj -c Release --no-build

  config-builder-container:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Publish ConfigBuilder container
        run: dotnet publish ConfigBuilder/ConfigBuilder.csproj -c Release /t:PublishContainer

      - name: Smoke-test ConfigBuilder container
        run: |
          set -euo pipefail
          workspace="$(mktemp -d)"
          mkdir -p "$workspace/ConfigBuilder/bin/Release/net10.0"
          mkdir -p "$workspace/Plugins/SamplePlugin/bin/Release/net10.0"
          mkdir -p "$workspace/submodules/btcpayserver/BTCPayServer"
          : > "$workspace/Plugins/SamplePlugin/bin/Release/net10.0/SamplePlugin.dll"
          : > "$workspace/submodules/btcpayserver/BTCPayServer/BTCPayServer.csproj"

          docker run --rm \
            --volume "$workspace:/workspace" \
            --workdir /workspace/ConfigBuilder/bin/Release/net10.0 \
            barebitcoin-config-builder:test

          python3 - "$workspace/submodules/btcpayserver/BTCPayServer/appsettings.dev.json" <<'PY'
          import json
          import sys
          from pathlib import Path

          settings_path = Path(sys.argv[1])
          if not settings_path.is_file():
              raise SystemExit(f"missing {settings_path}")

          settings = json.loads(settings_path.read_text())
          plugins = settings.get("DEBUG_PLUGINS", "")
          expected = "/workspace/Plugins/SamplePlugin/bin/Release/net10.0/SamplePlugin.dll;"
          if expected not in plugins:
              raise SystemExit(f"unexpected DEBUG_PLUGINS: {plugins!r}")
          print("ConfigBuilder wrote DEBUG_PLUGINS for the mounted workspace")
          PY
